# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - buildprocure-admin-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Build with Maven
        # -DskipTests: this pipeline's job is to build and deploy the jar,
        # not run the test suite against a live database. AdminConsoleBackendApplicationTests
        # boots the full Spring context (including the datasource), which
        # would otherwise try to reach the MySQL droplet from this runner's
        # IP - a different, unpredictable IP on every run - and previously
        # failed anyway because DB_HOST/DB_USERNAME/DB_PASSWORD were never
        # wired into this step's environment (saving a secret in GitHub
        # doesn't make it an env var here - it has to be referenced
        # explicitly via ${{ secrets.NAME }}).
        run: mvn clean install -DskipTests

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
      
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'buildprocure-admin-api'
          slot-name: 'Production'
          package: '*.jar'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_4D934DF091FD463293C3B3F51B2F056A }}