server:
  port: 8080

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Comma-separated list of origins allowed as a post-login redirect target
  # (checked by RedirectValidator) and for CORS. Covers the Vite dev server,
  # the local production-preview server (npm run start), and prod.
  allowed-redirect-origins: ${ALLOWED_REDIRECT_ORIGINS:http://localhost:5173,http://localhost:4173,https://admin.buildprocure.com}
  jwt-secret: ${JWT_SECRET}
  cookie-secure: ${COOKIE_SECURE:false}
  azure:
    tenant-id: ${AZURE_TENANT_ID:0f4f143b-570a-4c60-aa54-96f1d9d3fe2e}

spring:
  security:
    oauth2:
      client:
        registration:
          azure:
            client-id: ${AZURE_CLIENT_ID}
            client-secret: ${AZURE_CLIENT_SECRET}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          azure:
            issuer-uri: https://login.microsoftonline.com/${app.azure.tenant-id}/v2.0
logging:
  level:
    org.springframework.security: INFO