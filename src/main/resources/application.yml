server:
  port: 8080

spring:
  datasource:
    # MySQL lives on a separate DigitalOcean droplet. DB_HOST/DB_NAME
    # default to this project's actual droplet/database so a local run
    # works without extra setup - same pattern app.azure.tenant-id and
    # app.azure.client-id below already use for their (non-secret) real
    # values. DB_USERNAME/DB_PASSWORD stay required env vars with no
    # default (same as app.jwt-secret) - those are the real secrets, and
    # they're already saved in GitHub Actions as DB_HOST/DB_USERNAME/
    # DB_PASSWORD, matching the names used here.
    url: jdbc:mysql://${DB_HOST:143.198.64.132}:${DB_PORT:3306}/${DB_NAME:ilife}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    # Tables are created by hand via
    # src/main/resources/db/access_control_schema.sql - Hibernate never
    # creates/alters schema on its own.
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Comma-separated list of origins allowed to call this API (CORS).
  # Covers the Vite dev server, the local production-preview server
  # (npm run start), and prod.
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://admin.buildprocure.com}
  jwt-secret: ${JWT_SECRET}
  cookie-secure: ${COOKIE_SECURE:false}
  azure:
    tenant-id: ${AZURE_TENANT_ID:0f4f143b-570a-4c60-aa54-96f1d9d3fe2e}
    # Must match the frontend's VITE_AZURE_CLIENT_ID - the dedicated
    # "Single Page Application - Frontend (Admin-Console)" app registration
    # (separate from the backend's own app registration). Used by
    # MsalConfig to reject any ID token whose "aud" claim doesn't match -
    # i.e. a token issued for some other app in the tenant.
    client-id: ${AZURE_CLIENT_ID:89a724c9-018a-4cc1-90c7-a9ecc64afc6c}

logging:
  level:
    org.springframework.security: DEBUG